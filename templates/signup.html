{% extends "base.html" %}
{% block title %}Sign up · ECONOVA{% endblock %}
{% block content %}
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <h2>Sign up</h2>
  <label>Name
    <input type="text" name="name" value="{{ name or '' }}" required autofocus>
  </label>
  <label>Email
    <input type="email" name="email" value="{{ email or '' }}" required>
  </label>
  <label>Password (at least 8 characters)
    <input type="password" name="password" minlength="8" required>
  </label>
  <label>Confirm password
    <input type="password" name="confirm" minlength="8" required>
  </label>
  <button type="submit" class="btn">Create account</button>
  <p class="hint">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</form>
{% endblock %}
