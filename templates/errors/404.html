{% extends "base.html" %}
{% block title %}Page not found · ECONOVA{% endblock %}
{% block content %}
<section class="err-page" aria-labelledby="err-title">
  <p class="err-code">404</p>
  <h1 id="err-title">Page not found</h1>
  <p>The address may have changed, or the page doesn't exist.</p>
  <div class="actions">
    {% if g.user %}
    <a class="btn" href="{{ url_for('dashboard') }}">Go to Dashboard</a>
    <a class="btn secondary" href="{{ url_for('econova.catalog') }}">Course catalog</a>
    {% else %}
    <a class="btn" href="{{ url_for('index') }}">Go to the home page</a>
    <a class="btn secondary" href="{{ url_for('login') }}">Log in</a>
    {% endif %}
  </div>
</section>
{% endblock %}
